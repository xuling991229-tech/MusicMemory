<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>艺术画廊 - 最终修复版</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <style>
        :root { --accent: #1db954; }
        body, html { margin: 0; padding: 0; height: 100%; background: #080808; color: white; font-family: "Helvetica Neue", sans-serif; overflow: hidden; }
        
        /* 顶部管理栏 */
        #admin-bar { 
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%); 
            z-index: 2000; display: flex; gap: 20px; 
            background: rgba(20,20,20,0.95); padding: 10px 30px; 
            border-radius: 50px; backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.1); 
            align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .btn-save { background: var(--accent); color: white; border: none; padding: 8px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .music-input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 15px; border-radius: 15px; font-size: 12px; width: 220px; outline: none; }

        /* 内容布局 */
        .swiper-slide { background: radial-gradient(circle at center, #151515 0%, #080808 100%); }
        .slide-wrapper { height: 100vh; overflow-y: auto; padding: 140px 5% 80px; box-sizing: border-box; }
        .month-header { font-size: 5.5rem; font-weight: 100; text-align: center; margin-bottom: 50px; opacity: 0.2; letter-spacing: 12px; text-transform: uppercase; outline: none; }

        /* 拍立得相框自适应 */
        .photo-scatter { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; max-width: 1600px; margin: 0 auto; }
        .polaroid-card {
            background: #fff; padding: 12px 12px 45px 12px; border-radius: 2px;
            display: inline-block; width: auto; height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            position: relative; cursor: pointer;
        }
        .polaroid-card:hover { transform: translateY(-12px) rotate(0deg) !important; z-index: 100 !important; box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
        .polaroid-card img { display: block; max-width: 320px; max-height: 480px; width: auto; height: auto; pointer-events: none; }
        .photo-desc { color: #333; font-family: "STKaiti", serif; font-size: 1.1rem; margin-top: 15px; text-align: center; font-weight: bold; outline: none; }

        /* 灯箱放大修复 */
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); cursor: zoom-out; }
        #lightbox.active { display: flex; }
        #lightbox-content .polaroid-card { transform: scale(1.1) rotate(0deg) !important; cursor: default; }
        #lightbox-content .admin-only { display: none !important; }

        /* 管理按钮 */
        .admin-only { position: absolute; opacity: 0; transition: 0.3s; z-index: 10; }
        .polaroid-card:hover .admin-only { opacity: 1; }
        .delete-btn { top: -12px; right: -12px; background: #ff4757; color: white; border: 2px solid #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        #video-input { position: fixed; bottom: 20px; left: 20px; width: 110px; border-radius: 12px; z-index: 2000; opacity: 0.4; border: 1px solid var(--accent); transform: scaleX(-1); }
        .start-hint { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<div id="start-screen" class="start-hint">
    <div style="text-align: center;">
        <h1 style="font-weight: 100; letter-spacing: 15px; margin-bottom: 10px;">GALLERY</h1>
        <p style="color: var(--accent); font-size: 12px; letter-spacing: 4px;">点击屏幕开启感应翻页</p>
    </div>
</div>

<div id="admin-bar">
    <button class="btn-save" onclick="saveProject()">💾 保存当前修改</button>
    <input type="text" class="music-input" placeholder="输入音频链接..." onchange="updateMusic(this.value)">
    <span id="music-status" style="font-size: 11px; color: var(--accent);">OFF</span>
</div>

<div id="lightbox" onclick="this.classList.remove('active')"><div id="lightbox-content"></div></div>
<video id="video-input" playsinline muted autoplay></video>
<audio id="bgm-player" loop></audio>

<div class="swiper">
    <div class="swiper-wrapper" id="main-wrapper"></div>
</div>

<script>
    const months = ["2025-05", "2025-06", "2025-07", "2025-08", "2025-09", "2025-10", "2025-11", "2025-12", "2026-01"];
    const wrapper = document.getElementById('main-wrapper');
    const player = document.getElementById('bgm-player');
    
    months.forEach(m => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `<div class="slide-wrapper"><div class="month-header" contenteditable="true">${m}</div><div class="photo-scatter"></div></div>`;
        wrapper.appendChild(slide);
    });

    const swiper = new Swiper('.swiper', { 
        speed: 1000, 
        mousewheel: false,
        on: { slideChange: () => handleMusicTransition() }
    });

    function updateMusic(url) {
        swiper.slides[swiper.activeIndex].setAttribute('data-music', url);
        handleMusicTransition();
    }

    function handleMusicTransition() {
        const url = swiper.slides[swiper.activeIndex].getAttribute('data-music');
        const status = document.getElementById('music-status');
        if (url) {
            if (player.src !== url) { player.src = url; player.play().then(() => status.innerText = 'ON').catch(() => status.innerText = 'OFF'); }
        } else { player.pause(); status.innerText = 'OFF'; }
    }

    // --- 修复后的交互逻辑：点击放大 ---
    document.addEventListener('click', (e) => {
        const card = e.target.closest('.polaroid-card');
        const isDelete = e.target.closest('.delete-btn');
        const isEdit = e.target.hasAttribute('contenteditable');

        if (card && !isDelete && !isEdit) {
            const lb = document.getElementById('lightbox');
            const lbc = document.getElementById('lightbox-content');
            lbc.innerHTML = card.outerHTML; // 使用 outerHTML 保持结构
            lb.classList.add('active');
        }
    });

    // 拖拽上传
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => {
        e.preventDefault();
        const activeGrid = document.querySelector('.swiper-slide-active .photo-scatter');
        Array.from(e.dataTransfer.files).forEach(file => {
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const card = document.createElement('div');
                    card.className = 'polaroid-card';
                    card.style.transform = `rotate(${(Math.random() * 10 - 5).toFixed(1)}deg)`;
                    card.innerHTML = `<button class="admin-only delete-btn" onclick="this.closest('.polaroid-card').remove(); event.stopPropagation();">×</button><img src="${ev.target.result}"><div class="photo-desc" contenteditable="true">点击输入文字...</div>`;
                    activeGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            }
        });
    });

    // --- 智能矢量挥手 ---
    const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });
    
    let lastX = 0, lastTime = 0, cooldown = false;
    hands.onResults(res => {
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0 && !cooldown) {
            const x = res.multiHandLandmarks[0][8].x;
            const now = Date.now();
            const dt = now - lastTime;
            if (dt > 10 && dt < 100) {
                const velocity = (x - lastX) / dt;
                // 提高阈值 0.0035 -> 0.004 以进一步降低误触
                if (velocity < -0.004) { swiper.slidePrev(); lockout(); }
                else if (velocity > 0.004) { swiper.slideNext(); lockout(); }
            }
            lastX = x; lastTime = now;
        }
    });
    function lockout() { cooldown = true; setTimeout(() => { cooldown = false; }, 1600); }

    const camera = new Camera(document.getElementById('video-input'), {
        onFrame: async () => { if(document.getElementById('video-input').readyState >= 2) await hands.send({image: document.getElementById('video-input')}); },
        width: 320, height: 240
    });

    // --- 修复后的保存功能：不刷新页面也能保存 ---
    function saveProject() {
        // 克隆整个文档用于处理
        const clone = document.documentElement.cloneNode(true);
        
        // 清理克隆件中的 UI 和编辑属性
        clone.querySelector('#admin-bar').remove();
        clone.querySelector('#start-screen').style.display = 'flex';
        clone.querySelectorAll('.admin-only').forEach(el => el.remove());
        clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
        
        const blob = new Blob(["<!DOCTYPE html>\n" + clone.outerHTML], {type: 'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '我们的珍藏回忆录.html';
        a.click();
        
        alert("已为您导出成品 HTML 文件。您可以继续在当前页面编辑。");
    }

    document.getElementById('start-screen').onclick = function() {
        this.style.display = 'none';
        camera.start().catch(() => alert("请允许摄像头访问"));
        handleMusicTransition();
    };
</script>
</body>
</html>
